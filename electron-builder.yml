appId: app.docutrack.reader
productName: DocuTrack
executableName: DocuTrack
copyright: Copyright © DocuTrack Contributors
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
extraMetadata:
  name: docutrack
  main: electron/main.cjs
fileAssociations:
  - ext: pdf
    name: PDF Document
    role: Viewer
  - ext: epub
    name: EPUB Book
    role: Viewer
  - ext: djvu
    name: DjVu Archive
    role: Viewer
win:
  icon: public/pwa-512x512.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: DocuTrack-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: public/pwa-512x512.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Office;Education;Viewer
  artifactName: DocuTrack-${version}-${arch}.${ext}
mac:
  icon: public/pwa-512x512.png
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  artifactName: DocuTrack-${version}-${arch}.${ext}
dmg:
  sign: false
